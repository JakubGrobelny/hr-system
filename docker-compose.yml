name: hr-system

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hr_system
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Trust X-Forwarded-* headers set by nginx (scheme, client IP).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Database: "Host=db;Port=5432;Database=hr_system;Username=hr;Password=${POSTGRES_PASSWORD:-hr}"
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@hr.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin123!}
      Seed__DemoUsers: ${SEED_DEMO_USERS:-true}
      Seed__DemoUsersPassword: ${DEMO_USERS_PASSWORD:-Demo123!}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
